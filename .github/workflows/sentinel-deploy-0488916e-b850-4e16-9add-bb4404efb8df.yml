name: Deploy Content to tamarchecksagain [0488916e-b850-4e16-9add-bb4404efb8df]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-0488916e-b850-4e16-9add-bb4404efb8df.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main-sentinel-deployment-sentinel-deployment ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-0488916e-b850-4e16-9add-bb4404efb8df.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinelrg'
      workspaceName: 'tamarchecksagain'
      workspaceId: '9642f617-a14c-4ae7-8cac-874745924b81'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AutomationRule'
      branch: 'main-sentinel-deployment-sentinel-deployment'
      sourceControlId: '0488916e-b850-4e16-9add-bb4404efb8df'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_0488916eb8504e169addbb4404efb8df }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_0488916eb8504e169addbb4404efb8df }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_0488916eb8504e169addbb4404efb8df }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_0488916eb8504e169addbb4404efb8df }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_0488916eb8504e169addbb4404efb8df }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_0488916eb8504e169addbb4404efb8df }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_0488916eb8504e169addbb4404efb8df }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_0488916eb8504e169addbb4404efb8df }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_0488916eb8504e169addbb4404efb8df }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-0488916e-b850-4e16-9add-bb4404efb8df.ps1